# arcana.conf — the only door into the platform from outside the host.
#
# Every service binds to 127.0.0.1 and nothing else (see each main.ts). That is
# deliberate and stays true: this file is what decides which of their routes the
# outside world can reach, and it is a short list.
#
# TLS IS HERE. arcana-arena.com, Let’s Encrypt, HTTP-01, renewed by certbot’s
# own timer. Going public was a decision and not a default — this host holds
# funded wallets — so what it exposes is exactly two ports: 80, which only
# answers the ACME challenge and redirects, and 443. Postgres and MinIO bind
# 0.0.0.0 and are held shut by ufw alone; that is worth changing and has not
# been changed here.
#
# ------------------------------------------------------------------ rate limit
#
# TWO LAYERS, AND THEY MEASURE DIFFERENT THINGS. This zone is a coarse net
# against floods, keyed on the real client address. The precise limits — 10
# agent creations an hour per WALLET, and the rest — live in the application,
# where the identity is proven rather than inferred from a packet.
#
# $binary_remote_addr, not a forwarded header: at this layer the peer IS the
# client, and keying on anything the caller can write would let one attacker hold
# as many buckets as they like.
limit_req_zone $binary_remote_addr zone=arcana_api:10m rate=20r/s;
limit_req_status 429;
limit_req_log_level warn;

# ------------------------------------------------------------------- crawlers
#
# A CRAWLER IS MANY ADDRESSES AND ONE VISITOR, so the zone above never sees it:
# each address stays far under 20r/s while the fleet behind it saturates the
# host. Measured 2026-10-06: ~5 requests a second, seven in ten from declared
# crawlers, most of them walking /agents/<id>?tab=decisions&page=N&open=M — a
# URL space with no end, every page of it a count over the decisions table.
# Two cores sat at 0% idle and the home page took 7.5 seconds.
#
# So crawlers are keyed by WHO THEY SAY THEY ARE, one bucket per family, and a
# person's browser has an empty key, which limit_req does not count at all.
# The User-Agent is the caller's to write, and that is fine here: lying about
# it only moves a crawler back under the per-address limit it already had.
#
# facebookexternalhit is deliberately absent. It fetches one page when someone
# shares a link, and a preview that fails is a feature that broke.
map $http_user_agent $arcana_crawler_ua {
    default                 "";
    ~*meta-externalagent    "meta";
    ~*meta-externalfetcher  "meta";
    ~*ClaudeBot             "claudebot";
    ~*Amazonbot             "amazonbot";
    ~*Applebot              "applebot";
    ~*Googlebot             "googlebot";
    ~*bingbot               "bingbot";
    ~*GPTBot                "gptbot";
    ~*OAI-SearchBot         "oai-searchbot";
    ~*PerplexityBot         "perplexitybot";
    ~*Bytespider            "bytespider";
    ~*PetalBot              "petalbot";
    ~*YandexBot             "yandexbot";
    ~*CCBot                 "ccbot";
    ~*SemrushBot            "semrushbot";
    ~*AhrefsBot             "ahrefsbot";
    ~*MJ12bot               "mj12bot";
    ~*DotBot                "dotbot";
    ~*DataForSeoBot         "dataforseobot";
}

# One crawler does not say who it is. 47.79.0.0/16 is a cloud range that sent
# 28,590 requests from 417 addresses across the two logs read 2026-10-06,
# under an old Chrome User-Agent, nearly all of them to the same decisions
# pages. It reads no robots.txt, so it is named by where it comes from. It
# shares a bucket rather than being denied: a person behind that range still
# gets a page, and the fleet gets one visitor's worth.
geo $arcana_crawler_net {
    default         "";
    47.79.0.0/16    "net-47.79";
}

map $arcana_crawler_ua $arcana_crawler {
    default $arcana_crawler_ua;
    ""      $arcana_crawler_net;
}

limit_req_zone $arcana_crawler zone=arcana_crawlers:1m rate=20r/m;

# --------------------------------------------------------------- port 80
#
# TWO JOBS AND NOTHING ELSE: answer the ACME challenge, and send everyone to
# https. It does NOT proxy the API or the app, so there is no plaintext path to
# anything that carries a session cookie — a redirect is the only thing a
# cleartext request can get.
#
# The challenge location stays after issuance rather than being removed. Renewal
# uses the same path, and a renewal that fails at 3am because somebody tidied up
# is a certificate that expires on a Saturday.
server {
    listen 80;
    listen [::]:80;
    server_name arcana-arena.com www.arcana-arena.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://arcana-arena.com$request_uri;
    }
}

# -------------------------------------------------------------- port 443
server {
    # `listen ... http2`, not `http2 on;`. The standalone directive arrived in
    # nginx 1.25; this host runs 1.18 and refuses to start with it, which is the
    # good failure — a config test that passes and a server that does not serve
    # is the other kind.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arcana-arena.com;

    ssl_certificate     /etc/letsencrypt/live/arcana-arena.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcana-arena.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ArcanaTLS:10m;
    ssl_session_tickets off;

    # HSTS. A year, and only once TLS is known to work — the header is a
    # PROMISE a browser remembers, and promising https before it is reliable
    # locks visitors out of a site that cannot serve them.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # This host runs AI agents with funded wallets. None of the surface needs to
    # be embedded, and none of it should be probed by another origin's page.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 64k;
    client_body_timeout 10s;
    server_tokens off;

    include /etc/nginx/arcana-locations.conf;
}

# www is a redirect, not a second site. A SIWE message names ONE domain, and a
# session signed for arcana-arena.com must not half-work on www — two origins
# for one site is two cookie jars and one confused login.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.arcana-arena.com;

    ssl_certificate     /etc/letsencrypt/live/arcana-arena.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arcana-arena.com/privkey.pem;

    return 301 https://arcana-arena.com$request_uri;
}

# ---------------------------------------------------- loopback, for the suites
#
# KEPT DELIBERATELY. Every verification suite reads http://127.0.0.1:8080, and
# pointing them at the public listener would mean the checks travel out through
# TLS and back — testing DNS and a certificate on every assertion about a score.
# It serves the same routes from the same include, so it cannot drift.
server {
    listen 127.0.0.1:8080;
    server_name _;

    # The upstreams are node processes, not a CDN. Keep bodies small: nothing
    # public takes an upload, and the largest legitimate POST is a SIWE
    # signature.
    client_max_body_size 64k;
    client_body_timeout 10s;

    # Say nothing about what is running. The version banner is free
    # reconnaissance and buys nobody anything.
    server_tokens off;

    include /etc/nginx/arcana-locations.conf;
}
