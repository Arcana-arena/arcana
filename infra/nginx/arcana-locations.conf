# The routes ARCANA serves — included by every server block, so the public
# listener and the loopback one cannot drift apart.
#
# THIS FILE EXISTS BECAUSE THE ALTERNATIVE IS TWO COPIES. Adding TLS meant a
# second server block with the same dozen locations, and a second copy of a
# routing table is a routing table that is wrong in one place: the day a
# prefix moves, the listener nobody tested keeps the old one. There is one
# copy, and both listeners include it.

    # ------------------------------------------------------------ the API tier
    #
    # THE HEADER IS APPENDED, NOT SET, and that is the whole defence.
    # $proxy_add_x_forwarded_for puts the real peer to the RIGHT of whatever the
    # caller sent, and Express — told to trust only 'loopback' — walks in from
    # the right and stops at the first address this proxy did not vouch for. A
    # caller who forges `X-Forwarded-For: 1.2.3.4` pushes their own value to the
    # left, where it is read as an earlier hop and ignored.
    #
    # Setting it instead of appending, or telling Express `trust proxy: true`,
    # would hand every caller the ability to choose their own rate-limit bucket.
    location /v1/ {
        limit_req zone=arcana_api burst=40 nodelay;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;

        # The application decides who may call what. The proxy must not be able
        # to grant machine-tier access by accident, so it never forwards a key
        # it was given and never adds one.
        proxy_set_header X-Internal-Key "";

        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # Route by prefix. Each service owns its own paths and there is no
        # overlap; anything unlisted falls through to the agent-service default
        # below, which answers 404 for routes it does not have.
        proxy_pass http://127.0.0.1:3001;
    }

    location /v1/marketplace/ {
        limit_req zone=arcana_api burst=40 nodelay;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header X-Internal-Key "";
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3002;
    }

    # arca-service listens on 3004 (arcana-arca.service: PORT=3004 — 3003 is taken
    # on this host). These two used to point at 3003, where nothing listens, so
    # every public call to /v1/arca/* and /v1/subscriptions/* answered 502 while
    # every service-to-service call, configured separately, worked. Found
    # 2026-09-14; service-errors-verify now requests these through the public
    # origin so a proxy pointing at a dead port cannot go unnoticed again.
    location /v1/arca/ {
        limit_req zone=arcana_api burst=40 nodelay;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header X-Internal-Key "";
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3004;
    }

    location /v1/subscriptions/ {
        limit_req zone=arcana_api burst=40 nodelay;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header X-Internal-Key "";
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3004;
    }

    # ------------------------------------------------------- the machine tier
    #
    # NEVER REACHABLE FROM OUTSIDE. /internal/* is the tier behind
    # X-Internal-Key: signer wallet export, manual decisions, payment claims,
    # DNA recompute. Those services already bind to loopback, so this is the
    # second lock rather than the only one — and it is here so that a future
    # `proxy_pass` added carelessly cannot open the tier by widening a prefix.
    #
    # 404 and not 403: a refusal that confirms the path exists is an invitation.
    location /internal/ {
        access_log /var/log/nginx/arcana-internal-attempt.log;
        return 404;
    }

    # Health probes answer without touching the API rate limit, so a monitor
    # cannot starve real callers and a flood cannot hide behind /healthz.
    location = /healthz {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:3001/healthz;
    }

    # ---------------------------------------------------------------- the app
    #
    # The Next.js surface, on 127.0.0.1:3000. Everything it shows is public and
    # readable without a wallet, which is why it can sit behind the same rate
    # limiter as the API rather than behind an exemption from it.
    #
    # THE WEB APP DOES NOT READ THE API THROUGH THIS DOOR. Its server-side reads
    # go straight to 3001/3002/3004. Routing them back through here would have
    # every page view arrive from 127.0.0.1, and the site would throttle itself
    # out of its own limiter — loopback is deliberately NOT exempt, so the fix
    # is to keep server-to-server reads off the public door rather than to punch
    # a hole in the limiter.
    #
    # Next's build output under /_next/static/ is content-hashed, so it is
    # cached hard by the browser. It is still rate limited: an asset is still a
    # request, and the burst is higher only because one page load legitimately
    # fetches a handful of chunks.
    location /_next/static/ {
        limit_req zone=arcana_api burst=200 nodelay;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        limit_req zone=arcana_api burst=80 nodelay;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;
        proxy_set_header X-Internal-Key "";

        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        proxy_pass http://127.0.0.1:3000;
    }