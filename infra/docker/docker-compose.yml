# ARCANA data stack (V1 foundation)
# Postgres (TimescaleDB for hypertables) and MinIO.
#
# Usage:
#   docker compose -f infra/docker/docker-compose.yml up -d
#
# Ports are exposed on localhost only unless HOST_POSTGRES etc. are overridden.
#
# KAFKA AND REDIS WERE REMOVED ON 2026-09-10. Both were scaffolded at the start
# and neither was ever used. The evidence was not an opinion:
#
#   * no client library in any of the four go.mod files or three package.json
#     files — no kafkajs, no sarama, no redis, no ioredis;
#   * no producer, consumer, or cache call anywhere in the source;
#   * and on the running VPS, zero client connections to :9092 or :6379.
#
# Services talk over HTTP (decision.client.ts, marketdata/client.go,
# entitlement.client.ts) and batch work runs on systemd timers. The event bus in
# architecture.md §1 and the leaderboard cache in §14 describe a design that was
# never built.
#
# It was not free to keep. Kafka's image runs the JVM with -Xmx1G -Xms1G, so on
# a 1963 MB host it reserved a gigabyte for a broker with no clients: 648 MB
# resident and a further 740 MB pushed to swap, on a machine that was swapping
# 1175 MB in total. Removing it is the cheapest capacity work available, and it
# is reversible — the named volumes are left in place, so restoring either
# service is a matter of putting its block back.
#
# If an event bus is genuinely wanted later, decide it then and size it for the
# host it runs on. Reintroducing this file's version would repeat the mistake.

name: arcana-data

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: arcana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arcana}
      POSTGRES_USER: ${POSTGRES_USER:-arcana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arcana}
    ports:
      - "${HOST_POSTGRES:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arcana} -d ${POSTGRES_DB:-arcana}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: arcana-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-arcana}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-arcana-secret}
    ports:
      - "${HOST_MINIO:-9000}:9000"
      - "${HOST_MINIO_CONSOLE:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
