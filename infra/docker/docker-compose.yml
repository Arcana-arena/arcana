# ARCANA data stack (V1 foundation)
# Postgres (TimescaleDB for hypertables), Redis, Kafka (KRaft single node).
#
# Usage:
#   docker compose -f infra/docker/docker-compose.yml up -d
#
# Ports are exposed on localhost only unless HOST_POSTGRES etc. are overridden.

name: arcana-data

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: arcana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arcana}
      POSTGRES_USER: ${POSTGRES_USER:-arcana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arcana}
    ports:
      - "${HOST_POSTGRES:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arcana} -d ${POSTGRES_DB:-arcana}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: arcana-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${HOST_REDIS:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: arcana-kafka
    restart: unless-stopped
    environment:
      # KRaft single-node mode
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://${HOST_KAFKA_ADVERTISE:-localhost}:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${HOST_KAFKA:-9092}:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  kafka_data:
